name: Publish catalog

on:
  push:
    tags:
      - v*

permissions:
  contents: write

concurrency: publish-catalog

env:
  AWS_REGION: eu-central-1
  CATALOG_BUCKET: moov-vulcano-wave-nodes
  # Baked immutably into every index.json entry, so it must never change.
  SITE_URL: https://moov-vulcano-wave-nodes.s3.eu-central-1.amazonaws.com

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Extract version from tag and remove "v" prefix
        id: catalog-version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" != v?* ]]; then
            echo "Tag '$TAG' does not start with 'v' and a version. Failing the workflow."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: npm test

      - name: Bundle
        run: npm run bundle

      - name: Aggregate node specifications
        run: npm run build

      - name: Check changelog and convert to correct format
        env:
          VERSION: ${{ steps.catalog-version.outputs.version }}
        run: |
          node scripts/check-changelog.mjs "$VERSION"
          node scripts/convert-changelog.mjs

      - name: Check out the published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Add this version to the site
        env:
          VERSION: ${{ steps.catalog-version.outputs.version }}
        run: |
          if [ -d "site/$VERSION" ]; then
            echo "Version $VERSION is already published. Bump the version instead of re-tagging."
            exit 1
          fi
          mkdir -p "site/$VERSION/docs"
          cp bundle.js specification.json "site/$VERSION/"
          cp changelog-converted.json site/changelog.json
          find lib/nodes -type f -name '*.md' -exec cp {} "site/$VERSION/docs/" \;
          node scripts/publish-site.mjs site "$VERSION" "$SITE_URL"

      - name: Publish to S3
        env:
          VERSION: ${{ steps.catalog-version.outputs.version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          : "${AWS_ACCESS_KEY_ID:?add the AWS_ACCESS_KEY_ID repository secret}"
          : "${AWS_SECRET_ACCESS_KEY:?add the AWS_SECRET_ACCESS_KEY repository secret}"
          # The bucket is what agents cache, so it decides whether this version is already published.
          if aws s3api head-object --bucket "$CATALOG_BUCKET" --key "$VERSION/specification.json" >/dev/null 2>&1; then
            echo "Version $VERSION is already published. Bump the version instead of re-tagging."
            exit 1
          fi
          aws s3 sync "site/$VERSION/" "s3://$CATALOG_BUCKET/$VERSION/" --no-progress --cache-control 'public, max-age=31536000, immutable'
          aws s3 cp "site/$VERSION/catalog-info.yaml" "s3://$CATALOG_BUCKET/$VERSION/catalog-info.yaml" --content-type text/yaml --cache-control 'public, max-age=31536000, immutable'
          # Proves the url about to be written into index.json really serves this version.
          curl -fsS -o /dev/null "$SITE_URL/$VERSION/bundle.js"
          aws s3 cp site/changelog.json "s3://$CATALOG_BUCKET/changelog.json" --cache-control 'public, max-age=60'
          aws s3 cp site/index.json "s3://$CATALOG_BUCKET/index.json" --cache-control 'public, max-age=60'
          echo "$SITE_URL/index.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Record the publish on gh-pages
        working-directory: site
        env:
          VERSION: ${{ steps.catalog-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish catalog $VERSION"
          git push
